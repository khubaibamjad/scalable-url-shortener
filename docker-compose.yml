services:
  db:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
      PGDATA: /data/postgres
    volumes:
      - 'db:/data/postgres'
    ports:
      - '5433:5432'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}'
      interval: 5s
      retries: 5
volumes:
  db: null
